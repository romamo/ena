---
apiVersion: cloudfall/v1
kind: Baseline
metadata:
  id: debian-application
  description: Debian 13 host with the Cloudfall baseline and no software RAID
spec:
  os:
    distribution: Debian
    versions:
    - '13'
    serviceManager: systemd
  storage:
    mounts:
    - path: /
      filesystem: ext4
      minimumBytes: 20000000000
  packages:
    required:
    - name: acl
    - name: ca-certificates
    - name: curl
    - name: git
    - name: rsync
    - name: unzip
    forbidden:
    - telnetd
  services:
    required:
    - name: ssh.service
      state: running
      status: enabled
    - name: apt-daily.timer
      state: running
      status: enabled
  firewall:
    policy: default-deny
    allowedInbound:
    - port: 22
      protocol: tcp
      description: ssh
    - port: 80
      protocol: tcp
      description: http
    - port: 443
      protocol: tcp
      description: https
  configuration:
    files:
    - path: /etc/ssh/sshd_config
      capture: hash
      owner: root
      group: root
      mode: '0644'
