[project]
name = "ena"
version = "0.1.0"
description = "An AI agent for the back office of a micro-business on its Bank of Cyprus account"
authors = [
    { name = "Romamo", email = "github@romavm.dev" }
]
requires-python = ">=3.15"
dependencies = [
    "claude-agent-sdk>=0.2.189",
    "fastapi>=0.165.0",
    "httpx>=0.29.0",
    "mcp>=1.20,<2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
    "uvicorn>=0.54.0",
]

[project.scripts]
ena-boc = "ena.connectors.boc_cli:main"
ena-serve = "ena.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
